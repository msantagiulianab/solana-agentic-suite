spring:
  datasource:
    url: jdbc:h2:mem:solana_payment_gateway;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # Exercise the versioned Flyway migrations against H2 (PostgreSQL mode)
      # instead of auto-generating DDL, so the production schema is what the
      # repository integration tests actually persist against.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Mirrors the production baseline so the migration path behaves identically
    # in tests. H2 is empty per-run, so no baseline is taken and V1 applies
    # normally; this only guards against a pre-populated test schema.
    baseline-on-migrate: true
    baseline-version: 1

solana:
  rpc:
    # Keep the suite fast, deterministic, and independent of external internet
    # / RPC flakiness. Escrow verification resolves to the deterministic demo
    # ceiling without ever dialing a Solana node.
    mock-mode: true
  gateway:
    treasury-pubkey: "4Nd1mBQtrMJVYVfKf2PJy9NZGibCcTRxpETqdrBHu19Y"
    mock-private-key: "4wBqpZM9xaSheZzJSMawUKKwhdpChKbZ5eu5ky4Vigw"
