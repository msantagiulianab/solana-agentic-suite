server:
  port: 8080

spring:
  application:
    name: solana-enterprise-payment-gateway

  # PostgreSQL persistence for the append-only x402 payment audit ledger.
  # Defaults match the local docker-compose.yml container; override via
  # environment variables in deployed environments.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/solana_payment_gateway}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres_secure_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

  jpa:
    hibernate:
      # Enterprise default: reject schema drift. Schema is owned exclusively by
      # the versioned Flyway migrations; Hibernate only validates that entity
      # mappings match the migrated schema.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  # Versioned schema migrations applied on startup before Hibernate validates.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

x402:
  network: "solana:devnet"
  escrow-pubkey: "7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU"
  asset: "USDC"
  price-atomic-units: 5000
  unit: "per-call"

solana:
  rpc:
    url: ${SOLANA_RPC_URL:https://api.devnet.solana.com}
    mock-mode: ${SOLANA_RPC_MOCK_MODE:false}
    # Short in-memory cache TTL for the x402 escrow hot path (cache hit <5ms).
    cache-ttl-millis: 5000
  gateway:
    # Destination wallet for on-chain channel settlement sweeps.
    treasury-pubkey: ${SOLANA_GATEWAY_TREASURY_PUBKEY:4Nd1mBQtrMJVYVfKf2PJy9NZGibCcTRxpETqdrBHu19Y}
    # Base58 Ed25519 seed (32 or 64 bytes) of the gateway settlement wallet that
    # signs sweep transactions. Never use a funded key in production; this is the
    # deterministic mock/default seed used by the sweep engine.
    mock-private-key: ${SOLANA_GATEWAY_MOCK_PRIVATE_KEY:4wBqpZM9xaSheZzJSMawUKKwhdpChKbZ5eu5ky4Vigw}