# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      gatewayUrl:
        type: string
        description: "URL of the Solana x402 compliance gateway"
        default: "http://localhost:8080"
      channelId:
        type: string
        description: "Payment channel identifier for x402 settlement"
        default: "chan_smoke_test_001"
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['agent-tools/mcp-server/dist/index.js'],
      env: {
        X402_GATEWAY_URL: config.gatewayUrl || 'http://localhost:8080',
        X402_CHANNEL_ID: config.channelId || 'chan_smoke_test_001'
      }
    })